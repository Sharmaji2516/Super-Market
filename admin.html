<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Soni & Son's</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #f3f4f6;
      padding-bottom: 20px;
    }
    .product-list-item {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 25px;
      border-bottom: 2px solid #f3f4f6;
      transition: var(--transition);
    }
    .product-list-item:last-child {
      border-bottom: none;
    }
    .product-list-item:hover {
      background: #fcfdfe;
    }
    
    .item-top {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 20px;
    }
    
    .item-top img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 12px;
    }
    
    .edit-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      margin-top: 10px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
    }
    
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .input-group.full {
      grid-column: span 3;
    }
    
    .input-group label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary);
    }
    
    .admin-input {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    
    .admin-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.1);
    }
    
    .save-btn {
      grid-column: span 3;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    
    .save-btn:hover {
      background: #144d18;
      transform: translateY(-2px);
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px; width: 22px; left: 4px; bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(30px); }
    
    .status-badge {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-right: 15px;
    }
    .status-in { background: rgba(76, 175, 80, 0.15); color: #2E7D32; }
    .status-out { background: rgba(211, 47, 47, 0.15); color: #d32f2f; }
    
    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      border-left: 5px solid var(--primary);
      transform: translateY(100px);
      transition: var(--transition);
      z-index: 1000;
    }
    .notification.show { transform: translateY(0); }
    
    @media (max-width: 768px) {
      .admin-container { margin: 80px auto; padding: 15px; }
      .edit-form { grid-template-columns: 1fr; }
      .input-group, .input-group.full, .save-btn { grid-column: span 1; }
      .item-top { grid-template-columns: 1fr; text-align: center; justify-items: center; }
      .item-top img { width: 150px; height: 150px; }
    }
  </style>
</head>
<body>


  <!-- Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-basket-shopping"></i> Soni<span>&Son's</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Back to Site</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="admin-container">
      <div class="admin-header">
        <h2><i class="fa-solid fa-store"></i> Store Management</h2>
        <p>Edit prices, badges, and status</p>
      </div>

      <div id="admin-product-list">
        <!-- Products will be injected here -->
      </div>
    </div>
  </div>

  <div id="notification" class="notification">
    <i class="fa-solid fa-check-circle" style="color: var(--primary); margin-right: 10px;"></i>
    Changes saved successfully!
  </div>

  <footer class="footer" style="padding: 2rem 0; margin-top: 4rem;">
    <div class="container" style="text-align: center;">
      <p style="color: rgba(255,255,255,0.7); font-size: 0.9rem;">&copy; 2026 <a href="https://www.chittortech.online/" target="_blank" style="color: var(--primary-light); font-weight: 700;">ChittorTech</a>. All rights reserved.</p>
      <p style="color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 0.5rem;">Developed and Maintained by <a href="https://www.chittortech.online/" target="_blank" style="color: white; border-bottom: 1px dashed rgba(255,255,255,0.3);">ChittorTech</a></p>
    </div>
  </footer>

  <script type="module">
    import { getProductsFromFirebase, saveProductToFirebase, updateProductStock, listenForProducts } from './firebase-config.js';

    let productsArray = [];

    async function showNotification() {
      const notification = document.getElementById('notification');
      notification.classList.add('show');
      setTimeout(() => notification.classList.remove('show'), 3000);
    }

    async function renderAdminList(products) {
      const container = document.getElementById('admin-product-list');
      productsArray = products; // Keep a local copy for updateProduct function
      
      if (!productsArray || productsArray.length === 0) {
        container.innerHTML = "<p style='text-align: center; padding: 20px;'>No products found in database.</p>";
        return;
      }
      
      let html = '';
      productsArray.sort((a,b) => a.id - b.id).forEach(p => {
        const isInStock = p.inStock !== false; // Default true
        html += `
          <div class="product-list-item">
            <div class="item-top">
              <img src="${p.image}" alt="${p.name}">
              <div class="product-info">
                <h3>${p.name}</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Product ID: #${p.id}</p>
              </div>
              <div style="display: flex; align-items: center;">
                <span class="status-badge ${isInStock ? 'status-in' : 'status-out'}" id="badge-${p.id}">
                  ${isInStock ? 'IN STOCK' : 'OUT OF STOCK'}
                </span>
                <label class="toggle-switch">
                  <input type="checkbox" ${isInStock ? 'checked' : ''} onchange="handleStockChange(${p.id}, this.checked)">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            
            <div class="edit-form" id="form-${p.id}">
              <div class="input-group">
                <label>Price (₹)</label>
                <input type="number" class="admin-input" id="price-${p.id}" value="${p.price}">
              </div>
              <div class="input-group">
                <label>Offer / Badge Text</label>
                <input type="text" class="admin-input" id="offer-${p.id}" value="${p.offer || ''}" placeholder="e.g. 25% OFF">
              </div>
              <div class="input-group">
                <label>Unit</label>
                <input type="text" class="admin-input" id="unit-${p.id}" value="${p.unit || ''}" placeholder="e.g. piece">
              </div>
              <div class="input-group full">
                <label>Description</label>
                <textarea class="admin-input" id="desc-${p.id}" rows="2" style="resize: vertical;">${p.desc}</textarea>
              </div>
              <button class="save-btn" id="save-btn-${p.id}">
                <i class="fa-solid fa-save"></i> Save Changes
              </button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;

      // Add event listeners back
      productsArray.forEach(p => {
        const btn = document.getElementById(`save-btn-${p.id}`);
        if(btn) btn.onclick = () => updateProduct(p.id);
      });
    }

    async function handleStockChange(id, status) {
      await updateProductStock(id, status);
      showNotification();
      // The listenForProducts will trigger a re-render automatically
    }

    async function updateProduct(id) {
      const price = document.getElementById(`price-${id}`).value;
      const desc = document.getElementById(`desc-${id}`).value;
      const offer = document.getElementById(`offer-${id}`).value;
      const unit = document.getElementById(`unit-${id}`).value;
      
      const product = productsArray.find(p => p.id == id);
      if (product) {
        product.price = parseFloat(price);
        product.desc = desc;
        product.offer = offer;
        product.unit = unit;
        
        await saveProductToFirebase(product);
        showNotification();
      }
    }

    // Expose functions into global window
    window.handleStockChange = handleStockChange;

    document.addEventListener('DOMContentLoaded', () => {
      listenForProducts(renderAdminList);
    });
  </script>
</body>
</html>
