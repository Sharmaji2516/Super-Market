<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure administrative login for CHITTORGARH HUB. Access the admin console to manage store products, stock, and contact messages.">
  <title>Admin Login | Chittorgarh Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090f1d;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(5, 150, 105, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(251, 191, 36, 0.08) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 25px 25px, 25px 25px;
      padding: 24px;
      position: relative;
    }
    
    /* Soft ambient background glow objects */
    .glow-sphere {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: var(--primary);
      filter: blur(120px);
      opacity: 0.15;
      z-index: 1;
      pointer-events: none;
    }
    .glow-sphere-1 { top: 20%; left: 10%; }
    .glow-sphere-2 { bottom: 20%; right: 10%; background: var(--accent); }

    .login-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 460px;
      padding: 45px 40px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.4),
        0 0 40px rgba(5, 150, 105, 0.12);
      text-align: center;
      z-index: 10;
      position: relative;
    }
    
    .login-logo {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .login-logo i {
      font-size: 1.8rem;
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.4));
    }
    .login-logo span { 
      color: var(--accent);
      font-weight: 300;
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }
    
    .form-group {
      text-align: left;
      margin-bottom: 22px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 18px;
      color: #64748b;
      font-size: 1.1rem;
      pointer-events: none;
      transition: var(--transition);
    }
    .form-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }
    .form-input:focus {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--primary-light);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.2);
    }
    .form-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--primary-light);
      filter: drop-shadow(0 0 5px rgba(52, 211, 153, 0.4));
    }
    
    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, #047857 100%);
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 25px;
      box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
    }
    .login-btn:hover {
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(52, 211, 153, 0.4);
    }
    .login-btn:active {
      transform: translateY(0);
    }
    
    .error-msg {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 22px;
      font-size: 0.9rem;
      display: none;
      text-align: left;
      line-height: 1.4;
    }
    .success-msg {
      color: #86efac;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 22px;
      font-size: 0.9rem;
      display: none;
      text-align: left;
      line-height: 1.4;
    }
    
    .forgot-container {
      text-align: center;
      margin-top: 16px;
      margin-bottom: 5px;
    }
    .forgot-link {
      font-size: 0.92rem;
      color: var(--primary-light);
      font-weight: 600;
      text-decoration: none;
      transition: var(--transition);
      display: inline-block;
    }
    .forgot-link:hover {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
      transform: translateY(-1px);
    }
    
    .powered-by {
      margin-top: 35px;
      padding-top: 25px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .powered-by p {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 2px;
      margin: 0;
      text-transform: uppercase;
    }
    .powered-logo-link {
      display: inline-block;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      transition: var(--transition);
    }
    .powered-logo-link:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(52, 211, 153, 0.2);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
    }
    .powered-by img {
      height: 40px;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="glow-sphere glow-sphere-1"></div>
    <div class="glow-sphere glow-sphere-2"></div>

    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-store" style="color: var(--primary);"></i> CHITTORGARH<span>HUB</span>
      </div>
      <h2 style="margin-bottom: 8px; color: #ffffff; font-weight: 800; font-size: 1.8rem;">Admin Access</h2>
      <p style="color: #94a3b8; margin-bottom: 30px; font-size: 1rem;">Log in to manage CHITTORGARH HUB products and inventory.</p>

      <div id="message-box" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="admin@example.com" required>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          </div>
        </div>
        
        <div class="forgot-container">
          <a href="#" id="forgot-password" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Secure Login</button>
      </form>
      
      <p style="margin-top: 30px; font-size: 0.9rem; color: #94a3b8;">
        Don't have an account? <span style="color: var(--primary-light); font-weight: 600;">Contact the administrator.</span>
      </p>

      <div class="powered-by">
        <p>POWERED AND MAINTAINED BY</p>
        <a href="https://chittortech.com" target="_blank" class="powered-logo-link">
          <img src="chittortech_logo_1775884354186.png" alt="ChittorTech">
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const loginForm = document.getElementById('login-form');
    const messageBox = document.getElementById('message-box');
    const emailInput = document.getElementById('email');
    const forgotPasswordLink = document.getElementById('forgot-password');

    function showMessage(msg, type) {
      messageBox.innerHTML = msg;
      messageBox.style.display = 'block';
      if (type === 'success') {
        messageBox.className = 'success-msg';
      } else {
        messageBox.className = 'error-msg';
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Login successful, redirect to admin
        window.location.href = 'admin.html';
      } catch (error) {
        console.error("Login failed:", error);
        showMessage("Invalid email or password. Please try again.", "error");
      }
    });

    forgotPasswordLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address first to reset your password.", "error");
        emailInput.focus();
        return;
      }

      try {
        forgotPasswordLink.style.pointerEvents = 'none';
        forgotPasswordLink.style.opacity = '0.6';
        await sendPasswordResetEmail(auth, email);
        showMessage("Password reset link sent! Please check your email <strong>(including Spam/Junk folder)</strong>. If found in spam, mark it as <strong>'Not Spam'</strong> to ensure future emails are delivered to your inbox.", "success");
      } catch (error) {
        console.error("Forgot password failed:", error);
        let errMsg = "Failed to send password reset email. Please try again.";
        if (error.code === 'auth/user-not-found') {
          errMsg = "No account found with this email address.";
        } else if (error.code === 'auth/invalid-email') {
          errMsg = "Please enter a valid email address.";
        }
        showMessage(errMsg, "error");
      } finally {
        forgotPasswordLink.style.pointerEvents = 'auto';
        forgotPasswordLink.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
