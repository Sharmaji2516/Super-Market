<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Soni & Son's</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, #0a2f10 100%);
      padding: 20px;
    }
    .login-card {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 40px;
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .login-logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 30px;
    }
    .login-logo span { color: var(--accent); }
    
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    .login-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 10px;
    }
    .login-btn:hover {
      background: #144d18;
      transform: translateY(-2px);
    }
    .error-msg {
      color: #d32f2f;
      background: #ffeeee;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <i class="fa-solid fa-basket-shopping"></i> Soni<span>&Son's</span>
      </div>
      <h2 style="margin-bottom: 10px;">Admin Access</h2>
      <p style="color: var(--text-muted); margin-bottom: 30px;">Please login to manage the store.</p>

      <div id="error-box" class="error-msg"></div>

      <form id="login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn">Secure Login</button>
      </form>
      
      <p style="margin-top: 25px; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? Contact the administrator.
      </p>
    </div>
  </div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const loginForm = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Login successful, redirect to admin
        window.location.href = 'admin.html';
      } catch (error) {
        console.error("Login failed:", error);
        errorBox.textContent = "Invalid email or password. Please try again.";
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
